name: ParkingLotSystem Build Check

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false # 한 모듈이 실패해도 다른 모듈 빌드를 중단하지 않고 끝까지 검사
      matrix:
        module:
          - EntryAndExit
          - InfoMark
          - ParkingDetect

    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4

      - name: ARM 툴체인 및 CMake/Ninja 설치
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-none-eabi cmake ninja-build build-essential

      - name: ${{ matrix.module }} 빌드 수행
        working-directory: ${{ matrix.module }}
        run: |
          cmake -B build -G Ninja
          cmake --build build
